name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. This workflow never deploys, publishes, or commits.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Site audit (structure, links, CSP, external requests, budgets)
        run: npm run audit:site

      - name: Privacy scanner regression test (history blobs, deleted files)
        run: npm run test:privacy

      # Generic, public-safe rules only. The private identity denylist is never
      # available here; it belongs to the local pre-publication gate.
      - name: Identity and privacy scan (files, build output, full history)
        run: npm run audit:privacy -- --history

      - name: Confirm no source maps in the build
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "Source maps found in dist/" >&2
            exit 1
          fi

      - name: Dependency audit
        run: npm audit --audit-level=moderate
