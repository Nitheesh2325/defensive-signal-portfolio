name: Question
description: Ask how to use or customise the starter.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Include what you have already tried and which documentation you read.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 22.12, macOS 15
