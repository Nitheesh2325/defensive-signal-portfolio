name: Bug report
description: Something in the starter does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **do not** include real personal data, credentials, or private screenshots.
        Security vulnerabilities must be reported privately; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run build`
        2. Open /work/ at 320 CSS pixels wide
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Build or tooling
        - Content model
        - Layout or styling
        - Accessibility
        - Artwork or motion
        - Audits or CI
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, and browser if relevant.
      placeholder: Node 22.12, Windows 11, Firefox 140
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no real personal data or secrets.
          required: true
